{id:4,cat:'Color',n:['Retoque de raíz','Root touch-up'],d:['Para clientas de color con fórmula registrada.','For returning color clients with a formula on file.'],min:120,price:95,pt:'from',cons:false,req:['Disponible tras completar la primera cita de color.','Available after a completed first color appointment.']}];
const POL=[[['Depósito','Deposit'],['El depósito asegura tu cupo y se descuenta del total final.','A deposit secures your slot and is deducted from your final total.']],[['Cancelación y cambios','Cancellation & changes'],['Cambios gratis hasta 48 horas antes. Después, podrías perder el depósito.','Free changes up to 48 hours before. Later changes may forfeit the deposit.']],[['Inasistencia y llegadas tarde','No-show & late arrival'],['Si no asistes, pierdes el depósito. Con más de 15 minutos de retraso, el servicio puede acortarse o reprogramarse.','No-shows forfeit the deposit. After 15 minutes late, the service may be shortened or rescheduled.']],[['Reembolsos','Refunds'],['Reembolsamos el depósito si cancelamos nosotros. En color se cobra solo lo realizado.','Deposits are refunded if we cancel. Color services are charged only for what is performed.']]];
const CONDS=[['Selecciona…','Select…'],['Saludable','Healthy'],['Seco o dañado','Dry or damaged'],['Previamente decolorado','Previously bleached'],['Natural, nunca teñido','Natural, never colored']];
const SLOTS=['9:00','10:30','12:00','13:30','15:00','16:30'];
const IL={
cut:'<svg viewBox="0 0 48 48"><path class="s" d="M12 6L32 32"/><circle class="s" cx="35" cy="37" r="5"/><path class="s" d="M36 6L16 32"/><circle class="s" cx="13" cy="37" r="5"/><circle class="f" cx="24" cy="21.6" r="2.4"/></svg>',
blow:'<svg viewBox="0 0 48 48"><path class="s" d="M6 14h22a8 8 0 010 16H6z"/><path class="s" d="M16 30l-2 12h9l-1-12"/><path class="s" d="M36 16c3 0 5 2 8 2M36 22h9M36 28c3 0 5-2 8-2"/><circle class="f" cx="12" cy="22" r="2.4"/></svg>',
color:'<svg viewBox="0 0 48 48"><path class="s" d="M6 26h32c0 8-6 14-16 14S6 34 6 26z"/><path class="s" d="M26 22L41 6"/><path class="f" d="M23 25l4-4 3 3-4 4z"/><circle class="f" cx="14" cy="32" r="2.4"/></svg>',
root:'<svg viewBox="0 0 48 48"><path class="s" d="M15 36C11 26 15 16 19 8M24 36V8M33 36C37 26 33 16 29 8"/><rect class="f" x="10" y="36" width="28" height="5" rx="2.5"/></svg>'};
const IC={1:'cut',2:'blow',3:'color',4:'root'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let view='c',st=fresh(),sel=null,flt='all',an=true,flash=null;
function fresh(){return{step:0,cat:null,svc:null,date:null,time:null,info:{name:'',phone:'',email:'',notes:''},touched:false,cons:{hist:'',cond:0,goal:'',refs:'y'},pay:'deposit',agree:false,ref:null}}
const days=[...Array(8)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+i+1);return d});
const loc=()=>lang==='es'?'es-DO':'en-US';
const dl=d=>d.toLocaleDateString(loc(),{weekday:'short',month:'short',day:'numeric'});
const unavailable=(di,si)=>(di*7+si*3)%5===0;
const money=n=>'$'+n,dep=s=>Math.round(s.price*.3/5)*5,P=s=>(s.pt==='from'?t('from')+' ':'')+money(s.price);
const SC={pending:'b-pending',payp:'b-pay',conf:'b-conf',rem:'b-rem',done:'b-done',res:'b-res',can:'b-can'};
const badge=k=>`<span class="badge ${SC[k]}">${t(k)}</span>`;
const SVn=id=>SV.find(x=>x.id===id);
let Q=[
{id:'B-1042',name:'Camila Reyes',svc:3,wk:'tom',time:'10:30',status:'pending',pay:{k:'dpd',v:30},total:60,cons:true,spec:['Líder de Corte y Color','Corte & Color Lead'],hist:['Tinte de caja hace 6 meses, puntas decoloradas','Box dye 6 months ago, bleached ends'],cond:CONDS[2],goal:['Balayage caramelo claro','Light caramel balayage'],audit:[['aSub'],['aPaid',30]]},
{id:'B-1041',name:'Lucía Fernández',svc:2,wk:'tom',time:'13:30',status:'conf',pay:{k:'dpd',v:20},total:70,cons:false,spec:'—',audit:[['aSub'],['aPaid',20],['aConf']]},
{id:'B-1040',name:'Andrea Peña',svc:1,wk:'fri',time:'9:00',status:'payp',pay:{k:'unp'},total:55,cons:false,spec:'—',audit:[['aSub']]},
{id:'B-1039',name:'Marta Soto',svc:4,wk:'fri',time:'15:00',status:'res',pay:{k:'dpd',v:30},total:95,cons:false,spec:'—',audit:[['aSub'],['aConf'],['aReq']]}];
const wh=b=>(b.date?dl(b.date):t(b.wk))+' · '+b.time;
const payT=p=>p.k==='unp'?t('unp'):t(p.k)+` ($${p.v})`;

function render(){
  document.documentElement.lang=lang;
  $('#le').setAttribute('aria-pressed',lang==='es');$('#ln').setAttribute('aria-pressed',lang==='en');
  $('#vc').textContent=t('book');$('#vi').textContent=t('internal');
  $('#vc').setAttribute('aria-pressed',view==='c');$('#vi').setAttribute('aria-pressed',view==='i');
  $('#app').innerHTML=view==='c'?client():internal();
  if(an)window.scrollTo(0,0);
  an=false;
}
function go(n){st.step=n;an=true;render()}
function next(){let n=st.step+1;if(n===5&&!st.svc.cons)n=6;go(n)}
function prev(){let n=st.step-1;if(n===5&&!st.svc.cons)n=4;go(Math.max(0,n))}
const okP=()=>/^[\d\s+()-]{7,}$/.test(st.info.phone),okE=()=>/\S+@\S+\.\S+/.test(st.info.email);
function valid(){return st.info.name.trim()&&okP()&&okE()}

function client(){
  const s=st.svc,S=st.step,i=st.info,tc=st.touched;if(S===0)return welcome();
  let h='',f='';
  if(S===1){
    h=`<h2>${t('h1')}</h2><p class="lead">${t('l1')}</p><div class="cats">`+['Corte','Color'].map(c=>`<button class="opt cat" aria-pressed="${st.cat===c}" onclick="st.cat='${c}';st.svc=null;go(2)"><span class="ic">${IL[c==='Corte'?'cut':'color']}</span><span class="tx"><h3>${t(c==='Corte'?'c1':'c2')}</h3><div class="meta">${SV.filter(x=>x.cat===c).length} ${t('svcs')}</div></span></button>`).join('')+`</div>`;
  }else if(S===2){
    h=`<h2>${t('h2')}</h2><p class="lead">${t('l2')}</p>`+SV.filter(x=>x.cat===st.cat).map(x=>`<button class="opt" aria-pressed="${s?.id===x.id}" onclick="st.svc=SV.find(v=>v.id==${x.id});render()"><span class="ic">${IL[IC[x.id]]}</span><span class="tx"><h3>${t(x.n)}</h3><div>${t(x.d)}</div><div class="meta"><span>${x.min} min</span><span>${P(x)}</span></div>${x.cons?`<span class="tag">${t('cr')}</span>`:''}${s?.id===x.id?`<div class="meta" style="margin-top:10px">${t('rq')} ${t(x.req)}</div>`:''}</span></button>`).join('');
    f=`<button class="btn" ${s?'':'disabled'} onclick="next()">${t('go3')}</button>`;
  }else if(S===3){
    h=`<h2>${t('h3')}</h2><p class="lead">${t('l3').replace('{m}',s.min)}</p><div class="days">`+days.map((d,k)=>`<button class="day" aria-pressed="${st.date===k}" onclick="st.date=${k};st.time=null;render()"><span>${d.toLocaleDateString(loc(),{weekday:'short'})}</span><b>${d.getDate()}</b><span>${d.toLocaleDateString(loc(),{month:'short'})}</span></button>`).join('')+`</div>`;
    h+=st.date===null?`<p class="lead">${t('pick')}</p>`:`<div class="slots">`+SLOTS.map((x,j)=>`<button class="slot" ${unavailable(st.date,j)?'disabled':''} aria-pressed="${st.time===x}" onclick="st.time='${x}';render()">${x}</button>`).join('')+`</div><p class="lead" style="margin:14px auto 0;font-size:13px">${t('un')}</p>`;
    f=`<button class="btn" ${st.time?'':'disabled'} onclick="next()">${t('cont')}</button>`;
  }else if(S===4){
    h=`<h2>${t('h4')}</h2><p class="lead">${t('l4')}</p><div class="fld">
    <label for="n">${t('nm')}</label><input id="n" class="${tc&&!i.name.trim()?'invalid':''}" value="${esc(i.name)}" oninput="st.info.name=this.value" autocomplete="name">${tc&&!i.name.trim()?`<div class="errmsg">${t('e1')}</div>`:''}
    <label for="p">${t('ph')}</label><input id="p" type="tel" class="${tc&&!okP()?'invalid':''}" value="${esc(i.phone)}" oninput="st.info.phone=this.value" autocomplete="tel">${tc&&!okP()?`<div class="errmsg">${t('e2')}</div>`:''}
    <label for="e">${t('em')}</label><input id="e" type="email" class="${tc&&!okE()?'invalid':''}" value="${esc(i.email)}" oninput="st.info.email=this.value" autocomplete="email">${tc&&!okE()?`<div class="errmsg">${t('e3')}</div>`:''}
    <label for="o">${t('no')}</label><textarea id="o" rows="2" oninput="st.info.notes=this.value">${esc(i.notes)}</textarea></div>`;
    f=`<button class="btn" onclick="if(valid()){next()}else{st.touched=true;render()}">${t('cont')}</button>`;
  }else if(S===5){
    const c=st.cons;
    h=`<h2>${t('h5')}</h2><p class="lead">${t('l5')}</p><div class="fld">
    <label for="h">${t('q1')}</label><textarea id="h" rows="2" oninput="st.cons.hist=this.value;chk()">${esc(c.hist)}</textarea>
    <label for="c">${t('q2')}</label><select id="c" onchange="st.cons.cond=this.selectedIndex;chk()">${CONDS.map((o,k)=>`<option ${c.cond===k?'selected':''}>${o[LI()]}</option>`).join('')}</select>
    <label for="g">${t('q3')}</label><textarea id="g" rows="2" oninput="st.cons.goal=this.value;chk()">${esc(c.goal)}</textarea>
    <label>${t('q4')}</label><div class="chips">${[['y','yes'],['n','nop']].map(o=>`<button class="chip" aria-pressed="${c.refs===o[0]}" onclick="st.cons.refs='${o[0]}';render()">${t(o[1])}</button>`).join('')}</div></div>
    <div class="notice">${t('n5')}</div>`;
    f=`<button class="btn" id="cb" ${c.hist.trim()&&c.cond>0&&c.goal.trim()?'':'disabled'} onclick="next()">${t('gopay')}</button>`;
  }else if(S===6){
    const d=dep(s),amt=st.pay==='deposit'?d:s.price;
    h=`<h2>${t('h6')}</h2><p class="lead">${t('l6')}</p>
    <div class="sum"><div class="row"><span>${t(s.n)}</span><span>${P(s)}</span></div><div class="row"><span>${t('when')}</span><span>${dl(days[st.date])}, ${st.time}</span></div><div class="row"><span>${t('dur')}</span><span>${s.min} min${s.cons?` (${t('chg')})`:''}</span></div></div>
    ${s.cons?`<div class="notice">${t('n6')}</div>`:''}
    <div class="chips"><button class="chip" aria-pressed="${st.pay==='deposit'}" onclick="st.pay='deposit';render()">${t('dep')} ${money(d)}</button><button class="chip" aria-pressed="${st.pay==='full'}" onclick="st.pay='full';render()">${t('full')}</button></div>
    <div class="sum"><div class="row tot"><span>${t('due')}</span><span>${money(amt)}</span></div></div>
    ${POL.map(p=>`<details><summary>${t(p[0])}</summary><p>${t(p[1])}</p></details>`).join('')}
    <label class="check"><input type="checkbox" ${st.agree?'checked':''} onchange="st.agree=this.checked;document.getElementById('pb').disabled=!this.checked"><span>${t('agree')}${s.cons?t('agree2'):''}.</span></label>`;
    f=`<button class="btn" id="pb" ${st.agree?'':'disabled'} onclick="submit()">${t('pay')} ${money(amt)} ${t('book2')}</button>`;
  }else{
    h=`<h2>${t('h7')}</h2><p class="lead">${t('ref')} ${st.ref}. ${t('l7')}</p>
    <div class="sum"><div class="row"><span>${t('s2')}</span><span>${t(s.n)}</span></div><div class="row"><span>${t('when')}</span><span>${dl(days[st.date])}, ${st.time}</span></div><div class="row"><span>${t('paid')}</span><span>${money(st.pay==='deposit'?dep(s):s.price)}</span></div></div>
    <h3 style="font-size:22px;margin-top:26px">${t('next')}</h3><ul class="tl"><li class="done">${t('t1')}</li><li>${t('t2')}${s.cons?t('t2b'):''}</li><li>${t('t3')}</li><li>${t('t4')}</li><li>${t('t5')}</li></ul>`;
    f=`<button class="btn ghost" onclick="view='i';sel='${st.ref}';flash='${st.ref}';an=true;render()">${t('seeq')}</button><button class="btn ghost" onclick="st=fresh();an=true;render()">${t('another')}</button>`;
  }
  const ids=[1,2,3,4,5,6].filter(k=>k!==5||(s&&s.cons));
  const stp=ids.map(k=>`<i class="${k<S||S===7?'on':''} ${k===S?'cur':''}"></i>`).join('');
  const lab=S>0&&S<7?`${t('step')} ${ids.indexOf(S)+1} ${t('of')} ${ids.length} · ${t('s'+S)}`:'';
  const pill=s&&S>=3&&S<7?`<span class="pill"><b>${t(s.n)}</b> ${s.min} min · ${P(s)}${st.time?' · '+dl(days[st.date])+', '+st.time:''}</span>`:'';
  return `<div class="stage ${an?'an':''}"><div class="steps">${stp}</div><div class="nav">${S>0&&S<7?`<button class="back" onclick="prev()">${t('back')}</button>`:'<span></span>'}<span>${lab}</span><span></span></div>${pill}<div class="body">${h}</div>${f?`<div class="foot">${f}</div>`:''}</div>`;
}
function welcome(){
  const it=[['p1','p1b'],['p2','p2b'],['p3','p3b']].map((k,n)=>`<li><b>${n+1}</b><span class="pt">${t(k[0])}</span><span>${t(k[1])}</span></li>`).join('');
  return `<div class="stage wl ${an?'an':''}"><div class="wl-main"><div class="by"><b>Corte &amp; Color</b> by Salon Avatar</div><h1 class="wh"><span><i>${t('w1')}</i></span><span><i>${t('w2')}</i></span></h1><p class="lead">${t('wl')}</p><ol class="proc">${it}</ol></div><div class="foot"><button class="btn" onclick="go(1)">${t('start')}</button><p class="fine">${t('wn')}</p></div></div>`;
}
function chk(){const c=st.cons,b=$('#cb');if(b)b.disabled=!(c.hist.trim()&&c.cond>0&&c.goal.trim())}
function submit(){
  const s=st.svc,paid=st.pay==='deposit'?dep(s):s.price;
  st.ref='B-'+(1043+Q.length-4);
  Q.unshift({id:st.ref,name:st.info.name,svc:s.id,date:days[st.date],time:st.time,status:'pending',pay:{k:st.pay==='deposit'?'dpd':'fpd',v:paid},total:s.price,cons:s.cons,spec:s.cons?['Líder de Corte y Color','Corte & Color Lead']:'—',hist:st.cons.hist,cond:CONDS[st.cons.cond],goal:st.cons.goal,audit:[['aSub'],['aPaid',paid]]});
  go(7);
}
function internal(){
  const names=['all','pending','payp','conf','res','done','can'];
  const L=Q.filter(b=>flt==='all'||b.status===flt),b=Q.find(x=>x.id===sel);
  return `<div class="ops ${an?'an':''}"><section class="panel"><h2>${t('qt')}</h2>
  <div class="filters">${names.map(n=>`<button class="chip" aria-pressed="${flt===n}" onclick="flt='${n}';render()">${t(n)} ${n==='all'?Q.length:Q.filter(x=>x.status===n).length}</button>`).join('')}</div>
  <div class="scroll">${L.length?`<table><thead><tr><th>${t('cl')}</th><th>${t('sv')}</th><th>${t('when')}</th><th>${t('st')}</th></tr></thead><tbody>${L.map(x=>`<tr class="r ${x.id===sel?'sel':''} ${x.id===flash?'flash':''}" tabindex="0" onclick="sel='${x.id}';render()" onkeydown="if(event.key==='Enter'){sel='${x.id}';render()}"><td><b style="font-weight:500">${esc(x.name)}</b><br><span style="color:var(--mut);font-size:13px">${x.id}</span></td><td>${t(SVn(x.svc).n)}${x.cons?`<br><span class="tag">${t('cs')}</span>`:''}</td><td>${wh(x)}</td><td>${badge(x.status)}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">${t('none')}</div>`}</div></section>
  <section class="panel">${b?detail(b):`<h2>${t('dt')}</h2><div class="empty">${t('dn')}</div>`}</section></div>`;
}
function detail(b){
  return `<h2>${esc(b.name)}</h2><div style="margin-bottom:12px">${badge(b.status)}</div>
  <div class="sum"><div class="row"><span>${t('sv')}</span><span>${t(SVn(b.svc).n)}</span></div><div class="row"><span>${t('when')}</span><span>${wh(b)}</span></div><div class="row"><span>${t('pa')}</span><span>${payT(b.pay)}</span></div><div class="row"><span>${t('tot')}</span><span>${b.cons?t('from')+' ':''}${money(b.total)}</span></div><div class="row"><span>${t('sp')}</span><span>${tx(b.spec)}</span></div></div>
  ${b.cons?`<h3 style="font-size:20px;margin-top:20px">${t('ca')}</h3><div class="sum"><div class="row"><span>${t('hi')}</span><span>${esc(tx(b.hist))}</span></div><div class="row"><span>${t('co')}</span><span>${tx(b.cond)}</span></div><div class="row"><span>${t('go')}</span><span>${esc(tx(b.goal))}</span></div></div><div class="notice">${t('ni')}</div>`:''}
  <div class="act"><button class="p" onclick="setS('${b.id}','conf','aConf')">${t('a1')}</button><button onclick="setS('${b.id}','res','aRes')">${t('a2')}</button><button onclick="setS('${b.id}','rem','aRem')">${t('a3')}</button><button onclick="setS('${b.id}','done','aDone')">${t('a4')}</button><button class="d" onclick="setS('${b.id}','can','aCan')">${t('a5')}</button></div>
  <h3 style="font-size:20px;margin-top:24px">${t('au')}</h3><ul class="audit">${b.audit.map(a=>`<li>${t(a[0])}${a[1]||''}</li>`).join('')}</ul>`;
}
function setS(id,s,a){const b=Q.find(x=>x.id===id);b.status=s;b.audit.push([a]);render()}
function setLang(l){lang=l;try{localStorage.setItem('lg',l)}catch(e){}render()}
$('#le').onclick=()=>setLang('es');$('#ln').onclick=()=>setLang('en');
$('#vc').onclick=()=>{view='c';an=true;render()};$('#vi').onclick=()=>{view='i';an=true;render()};
render();
</script>
</body>
</html>
